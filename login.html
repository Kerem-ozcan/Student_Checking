<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Course Schedule</title>
    <style>
        :root { --primary-blue: #1d63ed; --primary-pink: #d81b60; --bg-gray: #f8fafd; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-gray); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #2d3436; margin-bottom: 10px; }
        p { color: #b2bec3; margin-bottom: 30px; font-size: 14px; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1.5px solid #f1f2f6; border-radius: 12px; box-sizing: border-box; background: #fcfdfe; }
        input:focus { outline: none; border-color: var(--primary-blue); }
        button { width: 100%; padding: 14px; background-color: var(--primary-pink); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        .error-messages { color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; list-style: none; }
        .link { margin-top: 25px; font-size: 14px; color: #636e72; }
        .link a { color: var(--primary-blue); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size: 45px; margin-bottom: 15px;">🤖</div>
        <h2>Welcome Back!</h2>
        <p>Login to manage your courses</p>
        
        {% if errors %}
        <ul class="error-messages">
            {% for error in errors %} <li>{{ error }}</li> {% endfor %}
        </ul>
        {% endif %}
        
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        
        <div class="link">
            Don't have an account? <a href="{{ url_for('register') }}">Register Now</a>
        </div>
    </div>
</body>
</html>
