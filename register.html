<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Course Schedule</title>
    <style>
        :root { --primary-blue: #1d63ed; --primary-pink: #d81b60; --bg-gray: #f8fafd; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-gray); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #2d3436; margin-bottom: 10px; }
        p { color: #b2bec3; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        input { width: 100%; padding: 14px; border: 1.5px solid #f1f2f6; border-radius: 12px; box-sizing: border-box; background: #fcfdfe; transition: 0.3s; }
        input:focus { outline: none; border-color: var(--primary-blue); }
        button { width: 100%; padding: 14px; background-color: var(--primary-blue); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background-color: #1652c9; transform: translateY(-2px); }
        .error-messages { color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; list-style: none; padding-left: 0; }
        .link { margin-top: 25px; font-size: 14px; color: #636e72; }
        .link a { color: var(--primary-pink); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        <p>Join our AI-powered schedule assistant</p>
        
        {% if errors %}
        <ul class="error-messages">
            {% for error in errors %} <li>{{ error }}</li> {% endfor %}
        </ul>
        {% endif %}
        
        <form method="POST" id="regForm">
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" id="pw" placeholder="Password" required>
            </div>
            <div class="form-group">
                <input type="password" name="confirm_password" id="cpw" placeholder="Confirm Password" required>
            </div>
            <button type="submit">Sign Up</button>
        </form>
        
        <div class="link">
            Already have an account? <a href="{{ url_for('login') }}">Login here</a>
        </div>
    </div>

    <script>
        document.getElementById('regForm').onsubmit = function(e) {
            if(document.getElementById('pw').value !== document.getElementById('cpw').value) {
                alert("Passwords do not match!");
                e.preventDefault();
            }
        };
    </script>
</body>
</html>
