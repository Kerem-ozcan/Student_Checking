<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Schedule Management System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="page-header">
        <h1>Course Schedule Management System</h1>
        <p>Plan your lessons, get organized with your AI assistant.</p>
    </header>

    <main class="dashboard-container">
        <section class="panel-card calendar-card">
            <header class="calendar-top-section">
                <div class="month-navigation">
                    <h2 id="currentMonthLabel"></h2>
                    <div class="arrow-wrapper">
                        <button class="arrow-btn" id="prevBtn">❮</button>
                        <button class="arrow-btn" id="nextBtn">❯</button>
                    </div>
                </div>
                <nav class="month-tabs" id="monthTabsContainer">
                    </nav>
            </header>

            <div class="calendar-wrapper">
                <div class="weekdays-header">
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                    <div>Sun</div>
                </div>
                <div id="calendarDays" class="days-grid"></div>
            </div>

            <input type="file" id="scheduleFileInput" accept="image/*" style="display: none;">
            <button id="uploadScheduleBtn" class="btn btn-primary btn-full-width">Integrate the Course Schedule</button>
            <div id="uploadStatus" style="text-align: center; margin-top: 10px; font-size: 14px; font-weight: 500;"></div>
        </section>

        <aside class="panel-card ai-sidebar">
            <header class="ai-profile-header">
                <div class="ai-avatar-badge">🤖</div>
                <div class="ai-meta">
                    <h3>AI Assistant</h3>
                    <span>Always ready to help</span>
                </div>
                <!-- İsteğe bağlı çıkış butonu eklendi -->
                <a href="/logout" style="margin-left:auto; text-decoration:none; font-size:12px; color:#d81b60; font-weight:bold;">Logout</a>
            </header>

            <div class="chat-viewport" id="chatBox">
                <div class="chat-message-row bot-row">
                    <div class="message-avatar">🤖</div>
                    <div class="bubble bot">Hi! I can help you organize your class schedule. What would you like to do?</div>
                </div>
            </div>

            <div class="chat-interactive-area">
                <div class="input-container-box">
                    <input type="text" id="aiInput" placeholder="Write your message...">
                    <button class="icon-send-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
                <button class="btn btn-ai-gradient btn-full-width" onclick="document.querySelector('.icon-send-btn').click();">Talk to AI</button>
            </div>
        </aside>
    </main>

    <footer class="system-footer">
        Today: <time id="footerTodayText"></time>
    </footer>

    <div class="modal-overlay" id="dayModal">
        <div class="modal-window">
            <header class="modal-top">
                <div class="modal-title-wrapper">
                    <h2 id="modalTitle"></h2>
                    <p>24-Hour Class Schedule</p>
                </div>
                <button class="modal-close-icon" onclick="closeModal()">&times;</button>
            </header>

            <div class="modal-scrollable-body" id="hourList">
                </div>

            <footer class="modal-bottom-actions">
                <button class="btn btn-cancel" onclick="closeModal()">Close</button>
            </footer>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
